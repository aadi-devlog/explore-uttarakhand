
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Contact</title>
    <link rel="stylesheet" href="css/style.css">
</head>
<body>
<header>
    <h1>Contact Us</h1>
    <p>Tell us about your travel plans</p>
</header>

<nav>
    <a href="index.html">Home</a>
    <a href="about.html">About</a>
    <a href="places.html">Places</a>
    <a href="gallery.html">Gallery</a>
    <a href="contact.html">Contact</a>
</nav>

<main class="content">
    <section class="form-box">
        <h2>Contact Form</h2>
        <form id="contactForm">
            <label for="name">Name</label>
            <input type="text" id="name" placeholder="Enter your name">

            <label for="email">Email</label>
            <input type="email" id="email" placeholder="Enter your email">

            <label for="message">Message</label>
            <textarea id="message" rows="5" placeholder="Write your message"></textarea>

            <button type="submit">Submit</button>
        </form>
        <p id="formMessage"></p>
    </section>

    <section>
        <h2>Useful Link</h2>
        <p>You can visit the <a href="https://uttarakhandtourism.gov.in/" target="_blank">Uttarakhand Tourism website</a> for more information.</p>
    </section>
</main>

<footer>
    <p>&copy; 2026 Explore Uttarakhand &bull; Aadi Devlog</p>
</footer>
<script src="js/script.js"></script>
</body>
</html>
